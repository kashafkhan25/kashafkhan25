name: Keep Streak Alive

on:
  schedule:
    - cron: "0 0 * * *"  # runs every day at midnight UTC
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Make a change
        run: |
          echo "Updated on $(date)" >> streak.txt

      - name: Commit changes
        run: |
          git config --global user.name "kashafkhan25"
          git config --global user.email "your-email@example.com"
          git add .
          git commit -m "Daily streak update" || echo "No changes to commit"
          git push
